services:
  # ============ 1. 数据库 ============
  mysql:
    image: mysql:8.0
    container_name: sqlpilot-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: sqlpilot_demo
      MYSQL_ROOT_HOST: "%"
      SQLPILOT_RO_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - ./data/init/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./data/init/02_readonly_user.sh:/docker-entrypoint-initdb.d/02_readonly_user.sh:ro
      - ./data/init/03_decoy_tables.sql:/docker-entrypoint-initdb.d/03_decoy_tables.sql:ro
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql -uroot -p$$MYSQL_ROOT_PASSWORD -e 'SELECT 1 FROM sqlpilot_demo.stores LIMIT 1' >/dev/null 2>&1"]
      interval: 5s
      retries: 20
      start_period: 30s

  # ============ 2. 一次性灌数据（跑完就退出）============
  seed:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: sqlpilot_demo
      SEED_MYSQL_USER: ${SEED_MYSQL_USER}
      SEED_MYSQL_PASSWORD: ${SEED_MYSQL_PASSWORD}
    command: ["python", "-m", "data.seed"]
    restart: "no"

  # ============ 3. 后端 FastAPI ============
  app:
    build: .
    container_name: sqlpilot-app
    depends_on:
      mysql:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: sqlpilot_demo
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL}
      DEMO_OFFLINE_MODE: ${DEMO_OFFLINE_MODE:-false}
    ports:
      - "8000:8000"

  # ============ 4. 前端 Streamlit ============
  web:
    build: .
    container_name: sqlpilot-web
    depends_on:
      app:
        condition: service_started
    environment:
      SQLPILOT_API_URL: http://app:8000
    ports:
      - "8501:8501"
    command: ["streamlit", "run", "web/streamlit_app.py",
              "--server.address", "0.0.0.0", "--server.port", "8501"]

volumes:
  mysql_data: